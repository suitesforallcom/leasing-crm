<!doctype html>
<meta charset="utf-8">
<title>m/ render harness</title>
<!--
  Стенд рендера мобильного клиента. Firebase не нужен: UI-модули — чистые
  функции от ctx, поэтому подставляем синтетический снимок и прогоняем каждый
  экран и каждый лист. Ловит ровно то, что не ловят parse-check и unit-тесты:
  падение внутри render(), пустой экран, класс без CSS.
  Живёт в tests/ намеренно: firebase.json игнорирует tests/** при деплое, значит
  отладочная страница НЕ попадает в прод. Открывать так:
    <статический сервер в корне репозитория>/tests/m-harness.html
    ?view=home|payments|unit|lease|invoice|switcher  — показать экран целиком
    &unit=302                                       — другой юнит
-->
<!-- Настоящий стиль приложения тянем из m.html на лету: копия здесь разошлась бы
     с продом, и проверка «класс без CSS» перестала бы что-либо значить. -->
<script>
  document.write('<style id="appcss"></style>');
  // Кэш-бастер обязателен: без него стенд проверяет классы по СТАРОЙ копии
  // стиля и ругается на только что добавленное правило (или, хуже, молчит про
  // удалённое). Ровно та же ловушка, что была со статическим import модулей.
  fetch('../m.html?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    document.getElementById('appcss').textContent = m ? m[1] : '';
    window.__cssReady = true;
  }).catch(() => { window.__cssReady = 'failed'; });
</script>
<style>
  /* Debug-стили держим ВНУТРИ #log: заданные на body шрифт и цвет наследовались
     приложением, и экран выглядел не так, как выглядит в проде. */
  body { margin:0; background:#111; }
  #log { padding:12px; white-space:pre-wrap; font:13px ui-monospace,monospace; color:#ddd; }
  .ok { color:#4ade80 } .bad { color:#f87171 } .warn { color:#fbbf24 }
  /* ?view=home|payments|unit|lease|invoice|switcher — показать экран целиком,
     в размер телефона. Без параметра стенд остаётся текстовым отчётом. */
  #stage { position:fixed; left:-9999px; top:0; width:390px; }
  body.visual #log { display:none }
  body.visual { background:#fff }
  body.visual #stage { position:static; width:390px; margin:0 auto; min-height:100vh; }
</style>
<div id="log">running…</div>
<div id="stage"><div class="app"><div id="screen"></div><div id="sheetBody"></div><div id="sheetFoot"></div></div></div>

<script type="module">
/* Динамический импорт с меткой времени. Статический import кэшируется в module
   map браузера, и после правки модуля стенд молча показывал СТАРЫЙ код —
   проверка, которая врёт, хуже отсутствующей. */
const V = '?v=' + Date.now();
const [money, fmt, home, payments, unit, lease, invoice, switcher, plan] = await Promise.all([
  import('../m/lib/money.js' + V), import('../m/lib/format.js' + V),
  import('../m/ui/home.js' + V), import('../m/ui/payments.js' + V), import('../m/ui/unit.js' + V),
  import('../m/ui/lease.js' + V), import('../m/ui/invoice.js' + V), import('../m/ui/switcher.js' + V),
  import('../m/ui/plan.js' + V),
]);

// Стиль подтягивается асинхронно — без ожидания проверка классов даст ложную тревогу.
for (let i = 0; i < 100 && !window.__cssReady; i++) await new Promise(r => setTimeout(r, 30));

const out = [];
const say = (cls, s) => out.push(`<span class="${cls}">${cls === 'ok' ? '  ok ' : cls === 'bad' ? 'FAIL ' : 'warn '}</span>${s}`);
let bad = 0;

/* ---- синтетический снимок: занятый/просроченный/пустой юнит + инвойсы ---- */
const YM = '2026-08';
const u = (id, over) => Object.assign({
  id, type: 'office', status: 'occupied', tenant: 'Acme LLC', tenantContact: 'Jane Roe',
  email: 'jane@acme.test', tel: '7275551234', rent: 2400, deposit: 2400,
  leaseStart: '2025-01-01', leaseEnd: '2026-12-31', payments: {},
}, over || {});
const units = [
  u('300', { payments: { [YM]: { status: 'paid', paidAt: '2026-08-03' } } }),
  u('301', { stripe: { lastInvoiceYm: YM, lastInvoiceId: 'in_1U4mHY2nq2bZh3q62SEa9jp4' } }),
  u('302', { tenant: '', status: 'vacant', tenantContact: '', email: '', tel: '' }),
  u('303', { tenant: "O'Brien & Sons <Ltd>", tenantContact: "O'Brien" }),
  // Занят, ставка есть, а почты нет — в проде так живёт сьют 101 на $13,318/мес.
  u('304', { tenant: 'No Mail LLC', email: '', rent: 1500 }),
  // Мульти-сьютовая лиза как в проде (National University: 6 сьютов, деньги
  // только на head'е). Проверяет, что карточка member'а честно оговаривает сумму.
  u('400', { groupId: 'g_test', groupRole: 'primary', rent: 13318.33, tenant: 'National University' }),
  u('401', { groupId: 'g_test', groupRole: 'member', rent: 0, tenant: 'National University' }),
  u('402', { groupId: 'g_test', groupRole: 'member', rent: 0, tenant: 'National University' }),
];
const snap = {
  buildings: [
    // Два этажа: проверяем группировку выбора юнита и подпись «Floor N».
    { id: 'b1', name: '4355 Central Ave', address: '4355 Central Ave', code: 'CEN', floors: [
      { id: 'f1', name: '3', units },
      { id: 'f4', name: '4th Floor', outline: { points: [[0,0],[400,0],[400,300],[0,300]] }, units: [
        u('440', { tenant: '', status: 'vacant', tenantContact: '', email: '', tel: '', rent: 900, x: 10, y: 10, w: 120, h: 90 }),
        u('441', { tenant: '', status: 'vacant', tenantContact: '', email: '', tel: '', rent: 950, x: 140, y: 10, w: 120, h: 90 }),
        u('445', { tenant: 'Jasmine Kennedy', tenantContact: 'Jasmine', x: 10, y: 110, w: 120, h: 90 }),   // занят
        // полигон + общая зона: обе ветки отрисовки должны работать
        u('446', { tenant: 'Poly Tenant', points: [[270,10],[390,10],[390,100],[330,100],[330,60],[270,60]] }),
        u('STAIR-4', { type: 'stairs', tenant: '', status: 'vacant', x: 140, y: 110, w: 60, h: 90 }),
        // Нарочно маленькая: её подпись НЕ помещается читаемо в обычном виде и
        // обязана появиться в увеличенном. Так проверяется, что зум реально
        // меняет порог, а не просто растягивает картинку.
        u('449', { tenant: '', status: 'vacant', tenantContact: '', email: '', tel: '', rent: 400, x: 214, y: 110, w: 26, h: 18 }),
      ] },
    ] },
    { id: 'b2', name: 'Second Building', address: '1 Main St', code: 'SEC', floors: [{ id: 'f1', name: '1', units: [u('100')] }] },
  ],
  invoices: [{ id: 'in_1U4mHY2nq2bZh3q62SEa9jp4', number: 'R-CEN-301-2026-08', status: 'open', bucket: 'open',
    total: 2400, amountPaid: 0, dueDate: '2026-08-05', description: 'Rent — 301',
    metadata: { unitId: '301', purpose: 'rent', ym: YM } }],
  invoicesAvailable: true, invoiceBuckets: {},
  settings: {
    landlordName: 'Crestview Holdings',
    // Форма 1:1 из прода (workspaces/default/data/state → state.settings).
    additionalServices: [
      { id: 'svc_1', name: 'Reserved parking space', amount: 75, frequency: 'monthly', description: 'Dedicated numbered space.' },
      { id: 'svc_2', name: 'Conference room — extra hours', amount: 35, frequency: 'hourly' },
      { id: 'svc_3', name: 'Key fob / access card replacement', amount: 35, frequency: 'once' },
      { id: 'svc_bad', name: 'Zero priced', amount: 0, frequency: 'monthly' },
    ],
  },
  role: 'admin', online: true, syncedAt: Date.now(), now: new Date('2026-08-15T12:00:00Z').getTime(),
};

/* Индекс юнитов строит клиент (m/lib/data.js rebuildIndex) — стенд обязан
   собрать его так же, иначе выбор юнита и арендатора окажется пустым, и
   проверка молча пройдёт на пустых списках. */
snap.units = [];
snap.unitsIndex = Object.create(null);
for (const b of snap.buildings) for (const f of (b.floors || [])) for (const un of (f.units || [])) {
  const entry = { unit: un, building: b, floor: f, key: b.id + '|' + un.id };
  snap.unitsIndex[entry.key] = entry;
  snap.units.push(entry);
}

const S = { tab: 'home', scope: 'b1', buildingId: 'b1', ym: YM, floor: 'all', q: '', searchAll: false, role: 'admin' };
const calls = [];
const ctx = () => ({
  S, snap, money, fmt,
  callCF: (n, p) => { calls.push([n, p]); return Promise.resolve({}); },
  building: snap.buildings[0],
  go(){}, openSheet(){}, closeSheet(){}, toast(){}, setScope(k){ S.scope = k; },
  refresh(){},
});

/* ---- 1. каждый экран и лист рендерится и не пуст ---- */
const SCREENS = { home, payments, plan };
const SHEETS = { unit, lease, invoice, switcher };
const painted = [];
for (const [name, mod] of Object.entries(SCREENS)) {
  try {
    const html = mod.render(ctx());
    if (!html || !String(html).trim()) { say('bad', `${name}.render() returned nothing`); bad++; }
    else { painted.push(html); say('ok', `${name}.render() → ${String(html).length} chars`); }
  } catch (e) { say('bad', `${name}.render() threw: ${e && e.message}`); bad++; }
}
for (const [name, mod] of Object.entries(SHEETS)) {
  // листы юнита/договора/счёта открываются с payload'ом — кладём его туда,
  // откуда модуль его читает (S.sheetPayload / S.sheetArg / S.payload).
  const ids = { buildingId: 'b1', floorId: 'f1', unitId: '301' };
  S.sheet = name; S.sheetPayload = ids; S.sheetArg = ids; S.payload = ids;
  for (const fn of ['render', 'foot']) {
    if (typeof mod[fn] !== 'function') continue;
    try {
      const html = mod[fn](ctx());
      if (fn === 'render' && (!html || !String(html).trim())) { say('bad', `${name}.render() returned nothing`); bad++; }
      else { painted.push(html || ''); say('ok', `${name}.${fn}() → ${String(html || '').length} chars`); }
    } catch (e) { say('bad', `${name}.${fn}() threw: ${e && e.message}`); bad++; }
  }
}
S.sheet = null;

/* ---- 2. каждый использованный класс существует в CSS (ловит потерянные блоки) ---- */
const cssText = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules].map(r => r.cssText); } catch { return []; } }).join('\n');
const used = new Set();
painted.join('\n').replace(/class="([^"]+)"/g, (m, c) => { c.split(/\s+/).filter(Boolean).forEach(x => used.add(x)); return m; });
const missing = [...used].filter(c => !cssText.includes('.' + c));
if (missing.length) { say('warn', `classes with no CSS rule: ${missing.join(', ')}`); }
else say('ok', `all ${used.size} classes used in markup have CSS`);

/* ---- 3. деньги: экраны и модель говорят одно и то же ---- */
try {
  const paid = money.verdict(units[0], YM, snap), open = money.verdict(units[1], YM, snap);
  if (paid.status !== 'paid' && paid.ui !== 'paid') { say('bad', `paid unit reads as ${paid.ui}`); bad++; }
  else say('ok', `paid unit → ${paid.ui} / ${paid.label}`);
  if (!(open.amount > 0)) { say('bad', 'open invoice has no amount for the UI'); bad++; }
  else say('ok', `unpaid unit → ${open.ui} · ${open.amount}`);
} catch (e) { say('bad', 'money verdict threw: ' + (e && e.message)); bad++; }

/* ---- 4. экранирование: имя с кавычкой и скобками не попадает в разметку сырым ---- */
const hostile = painted.join('\n');
if (/O'Brien & Sons <Ltd>/.test(hostile)) { say('bad', 'tenant name is injected into HTML unescaped'); bad++; }
else say('ok', 'hostile tenant name is escaped in every rendered view');

/* ---- 4b. каталог услуг доезжает до листа счёта ---- */
{
  const ids = { buildingId: 'b1', floorId: 'f1', unitId: '301' };
  S.sheet = 'invoice'; S.sheetPayload = ids; S.sheetArg = ids; S.payload = ids;
  S.inv = null;
  invoice.render(ctx());                       // создаёт S.inv
  if (S.inv) S.inv.preset = 'service';
  const html = invoice.render(ctx());
  painted.push(html);
  const named = ['Reserved parking space', 'Conference room — extra hours', 'Key fob / access card replacement']
    .filter(n => html.includes(n));
  if (named.length !== 3) { say('bad', `service catalog: показано ${named.length}/3 позиций`); bad++; }
  else say('ok', 'service catalog: все позиции с ценой видны в листе счёта');
  if (html.includes('Zero priced')) { say('bad', 'позиция с нулевой ценой не отфильтрована'); bad++; }
  else say('ok', 'позиция с нулевой ценой отфильтрована (как на десктопе)');
  const freq = html.includes('/mo') && html.includes('/hr') && html.includes('one-time');
  if (!freq) { say('bad', 'периодичность услуги не показана (/mo, /hr, one-time)'); bad++; }
  else say('ok', 'периодичность услуги показана');
  // выбор услуги подставляет сумму и текст
  invoice.handle('inv:svc', { getAttribute: () => 'svc_1' }, ctx());
  const after = invoice.render(ctx());
  painted.push(after);
  if (!(S.inv && String(S.inv.amount) === '75' && S.inv.memo === 'Reserved parking space')) {
    say('bad', `выбор услуги не подставил сумму/текст: ${JSON.stringify({a:S.inv&&S.inv.amount, m:S.inv&&S.inv.memo})}`); bad++;
  } else say('ok', 'выбор услуги подставляет сумму и текст для арендатора');
  invoice.handle('inv:svc', { getAttribute: () => 'svc_1' }, ctx());   // повторный тап снимает
  if (S.inv && S.inv.svcId) { say('bad', 'повторный тап не снимает выбор услуги'); bad++; }
  else say('ok', 'повторный тап снимает выбор услуги');
  S.inv = null; S.sheet = null;
}

/* ---- 4c. выбор юнита: свободные, по этажам, занятые объясняются ---- */
{
  S.lease = null; S.sheet = 'lease'; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
  const h1 = lease.render(ctx());
  painted.push(h1);
  const vac = ['300','440','441'].filter(id => h1.includes('Suite ' + id));
  if (h1.includes('Vacant right now · 0')) { say('bad', 'выбор юнита пуст — индекс snap.units не дошёл'); bad++; }
  else if (!h1.includes('Floor 3') || !h1.includes('4th Floor')) { say('bad', 'юниты не сгруппированы по этажам'); bad++; }
  else say('ok', 'выбор юнита: свободные сгруппированы по этажам');
  if (h1.includes('Suite 445')) { say('bad', 'занятый юнит попал в список для нового договора'); bad++; }
  else say('ok', 'занятый юнит в списке нового договора отсутствует');
  // поиск обязан находить ЗА пределами отрисованной страницы и объяснять занятые
  S.lease.q = '445';
  const h2 = lease.render(ctx());
  painted.push(h2);
  if (!/occupied/i.test(h2) || !h2.includes('Jasmine Kennedy')) {
    say('bad', 'поиск занятого юнита не объясняет, почему его нет'); bad++;
  } else say('ok', 'поиск занятого юнита объясняет: занят и кем');
  S.lease.q = '441';
  const h3 = lease.render(ctx());
  painted.push(h3);
  if (!h3.includes('Suite 441')) { say('bad', 'поиск не находит свободный юнит другого этажа'); bad++; }
  else say('ok', 'поиск находит свободный юнит на другом этаже');
  S.lease = null; S.sheet = null;
}

/* ---- 4d. экран заселения: три строки со статусами и отправка из них ---- */
{
  S.lease = null; S.inv = null;
  S.sheet = 'lease'; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
  lease.render(ctx());                                  // создаёт S.lease
  S.lease.done = { envelopeId: 'env_1', status: 'sent', stateWriteOk: true, email: 'a@b.co',
    suite: 'Suite 440', tenant: 'Elliot Reyes', buildingId: 'b1', floorId: 'f4', unitId: '440',
    leaseStart: '2026-09-01' };
  const h = lease.render(ctx());
  painted.push(h, lease.foot(ctx()));
  const rows = ['Lease', 'Security deposit', 'First rent'].filter(t => h.includes(t));
  if (rows.length !== 3) { say('bad', `экран заселения показывает ${rows.length}/3 строк`); bad++; }
  else say('ok', 'экран заселения: договор, депозит и первая рента на одном экране');
  if (!h.includes('September 2026')) { say('bad', 'первая рента без месяца начала договора'); bad++; }
  else say('ok', 'первая рента подписана месяцем начала договора');
  // депозит и рента ещё не отправлены → у обоих кнопка Send
  const sends = (h.match(/data-act="lease:invoice"/g) || []).length;
  if (sends !== 2) { say('bad', `кнопок отправки ${sends}, ожидалось 2`); bad++; }
  else say('ok', 'у неотправленных строк есть кнопка Send');

  // отправка депозита открывает лист счёта с назначением и обратным адресом
  let opened = null;
  const spy = () => Object.assign(ctx(), { openSheet: (n, p) => { opened = { n, p }; } });
  lease.handle('lease:invoice', { getAttribute: () => 'deposit' }, spy());
  if (!(opened && opened.n === 'invoice' && opened.p.preset === 'deposit'
        && opened.p.unitId === '440' && opened.p.returnTo === 'lease' && opened.p.slot === 'deposit')) {
    say('bad', 'Send депозита открывает не тот лист: ' + JSON.stringify(opened && opened.p)); bad++;
  } else say('ok', 'Send депозита открывает счёт с назначением и возвратом сюда');
  if (!S.lease) { say('bad', 'состояние мастера потеряно — возвращаться будет некуда'); bad++; }
  else say('ok', 'состояние экрана заселения переживает уход в счёт');

  // рента открывается за месяц начала договора
  opened = null;
  lease.handle('lease:invoice', { getAttribute: () => 'rent' }, spy());
  if (!(opened && opened.p.preset === 'rent' && opened.p.ym === '2026-09')) {
    say('bad', 'первая рента не за месяц начала договора: ' + JSON.stringify(opened && opened.p)); bad++;
  } else say('ok', 'первая рента открывается за 2026-09');

  // после отправки строка становится отмеченной, кнопки Send у неё больше нет
  S.lease.done.sent = { deposit: { id: 'in_dep', number: 'D-440', total: 1700, bucket: 'open' } };
  const h2 = lease.render(ctx());
  painted.push(h2);
  const sends2 = (h2.match(/data-act="lease:invoice"/g) || []).length;
  if (sends2 !== 1) { say('bad', `после отправки депозита кнопок ${sends2}, ожидалась 1`); bad++; }
  else say('ok', 'отправленная строка теряет кнопку и показывает статус');
  if (!h2.includes('D-440')) { say('bad', 'номер отправленного счёта не показан'); bad++; }
  else say('ok', 'в строке виден номер счёта');
  // единицы: 1700 — это ДОЛЛАРЫ. $170,000 означало бы, что кто-то смешал центы.
  if (!h2.includes('$1,700') || h2.includes('$170,000')) { say('bad', 'сумма счёта в строке — не в долларах'); bad++; }
  else say('ok', 'сумма в строке заселения в долларах');

  // лист счёта принимает переданные параметры и возвращает назад
  S.inv = null; S.sheet = 'invoice';
  S.sheetPayload = { buildingId: 'b1', floorId: 'f4', unitId: '440', preset: 'deposit', returnTo: 'lease', slot: 'deposit' };
  S.sheetArg = S.sheetPayload; S.payload = S.sheetPayload;
  painted.push(invoice.render(ctx()));
  if (!(S.inv && S.inv.preset === 'deposit' && S.inv.returnTo === 'lease')) {
    say('bad', 'лист счёта проигнорировал переданные параметры'); bad++;
  } else say('ok', 'лист счёта открывается с назначением и помнит, куда вернуться');
  let back = null;
  invoice.handle('inv:close', null, Object.assign(ctx(), { openSheet: (n) => { back = n; }, closeSheet: () => { back = 'closed'; } }));
  if (back !== 'lease') { say('bad', 'закрытие счёта не вернуло на экран заселения: ' + back); bad++; }
  else say('ok', 'закрытие счёта возвращает на экран заселения');
  S.lease = null; S.inv = null; S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
}

/* ---- 4e. сводка условий следует за вводом (живая проверка в DOM) ---- */
{
  S.lease = null; S.inv = null;
  S.sheet = 'lease';
  const ids = { buildingId: 'b1', floorId: 'f4', unitId: '440' };
  S.sheetPayload = ids; S.sheetArg = ids; S.payload = ids;
  lease.render(ctx());
  Object.assign(S.lease, { step: 3, name: 'E', email: 'e@x.co', phone: '1', start: '2026-09-01', term: '12' });
  const host = document.getElementById('sheetBody');
  host.innerHTML = lease.render(ctx());
  painted.push(host.innerHTML);
  await new Promise(r => setTimeout(r, 5));                 // биндер вешается через setTimeout(0)
  const dep = document.getElementById('lsDep'), recap = document.getElementById('lsRecap');
  if (!dep || !recap) { say('bad', 'на шаге условий нет поля депозита или сводки'); bad++; }
  else {
    const read = () => recap.innerText.replace(/\s+/g, ' ');
    dep.value = '1800'; dep.dispatchEvent(new Event('input', { bubbles: true }));
    const typed = read();
    dep.value = '0'; dep.dispatchEvent(new Event('input', { bubbles: true }));
    const zero = read();
    if (!/Deposit \$1,800/.test(typed)) { say('bad', 'сводка не следует за вводом депозита: ' + typed); bad++; }
    else say('ok', 'сводка обновляется по мере ввода депозита');
    if (!/Deposit \$0\b/.test(zero)) { say('bad', 'явный ноль в депозите не доехал до сводки: ' + zero); bad++; }
    else say('ok', 'явный ноль в депозите остаётся нулём (прощёный депозит)');
  }
  host.innerHTML = '';
  S.lease = null; S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;

  // ТОТ ЖЕ класс на листе счёта: «Total» стоит прямо над кнопкой Send.
  S.inv = null; S.sheet = 'invoice';
  const iid = { buildingId: 'b1', floorId: 'f1', unitId: '301' };
  S.sheetPayload = iid; S.sheetArg = iid; S.payload = iid;
  host.innerHTML = invoice.render(ctx());
  painted.push(host.innerHTML);
  await new Promise(r => setTimeout(r, 5));
  const iAmt = document.getElementById('invAmt'), iRec = document.getElementById('invRecap');
  if (!iAmt || !iRec) { say('bad', 'на листе счёта нет поля суммы или сводки'); bad++; }
  else {
    iAmt.value = '777'; iAmt.dispatchEvent(new Event('input', { bubbles: true }));
    const t = iRec.innerText.replace(/\s+/g, ' ');
    if (!/Total \$777/.test(t)) { say('bad', 'итог счёта не следует за вводом суммы: ' + t); bad++; }
    else say('ok', 'итог счёта обновляется по мере ввода суммы');
  }
  host.innerHTML = '';
  S.inv = null; S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
}

/* ---- 4f. план этажа ---- */
{
  S.tab = 'plan'; S.planFloor = 'f4';
  const h = plan.render(ctx());
  painted.push(h);
  // прямоугольники и полигон рисуются оба
  if (!/<rect[^>]*data-act="unit"/.test(h)) { say('bad', 'план не рисует прямоугольные юниты'); bad++; }
  else say('ok', 'план рисует прямоугольные юниты');
  if (!/<polygon[^>]*data-act="unit"/.test(h)) { say('bad', 'план не рисует полигональные юниты'); bad++; }
  else say('ok', 'план рисует полигональные юниты (сложная форма)');
  // общая зона не кликабельна и не красится статусом
  if (/data-id="STAIR-4"/.test(h)) { say('bad', 'лестница кликабельна — она ничего не должна'); bad++; }
  else say('ok', 'общие зоны не кликабельны');
  if (!/var\(--plan-common\)/.test(h)) { say('bad', 'общие зоны без своего цвета'); bad++; }
  else say('ok', 'общие зоны своим цветом');
  // цвет юнита — из money.uiStatus
  if (!/var\(--plan-overdue\)/.test(h)) { say('bad', 'просроченный юнит не покрашен статусом'); bad++; }
  else say('ok', 'цвет юнита берётся из денежной модели');
  // подписи не крупнее вместимости фигуры
  const fss = [...h.matchAll(/font-size="([\d.]+)"/g)].map(m => +m[1]);
  if (!fss.length) { say('bad', 'ни одной подписи на плане'); bad++; }
  else if (fss.some(v => v > 60)) { say('bad', 'подпись крупнее фигуры: ' + Math.max(...fss)); bad++; }
  else say('ok', 'подписи в пределах фигур (' + fss.length + ' шт.)');
  // этаж без геометрии не роняет экран
  S.planFloor = 'f1';
  const h2 = plan.render(ctx());
  painted.push(h2);
  if (!/no drawn plan/.test(h2)) { say('bad', 'этаж без геометрии не объяснён'); bad++; }
  else say('ok', 'этаж без чертежа объясняет это словами, а не пустотой');
  // переключение этажа и зум — рабочие действия
  if (plan.handle('planfloor', { getAttribute: () => 'f4' }, ctx()) !== true) { say('bad', 'переключение этажа не обработано'); bad++; }
  else say('ok', 'переключение этажа работает');
  plan.handle('planzoom', null, ctx());
  if (!S.planZoom) { say('bad', 'зум не переключился'); bad++; }
  else say('ok', 'зум переключается');
  S.planZoom = false; S.tab = 'home'; S.planFloor = null;
}

/* ---- 4g. роль без права отправки: отказ ДО работы, а не после ---- */
{
  const roleCtx = () => Object.assign(ctx(), { canSend: () => false });
  const homeH = home.render(roleCtx());
  painted.push(homeH);
  if (/data-k="lease"|data-k="invoice"/.test(homeH)) { say('bad', 'viewer видит кнопки отправки на главной'); bad++; }
  else say('ok', 'viewer не видит «отправить» на главной');
  if (!/cannot send|not send/i.test(homeH)) { say('bad', 'viewer не объяснили, почему кнопок нет'); bad++; }
  else say('ok', 'viewer получает объяснение, а не пустое место');

  S.lease = null; S.sheet = 'lease'; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
  const lh = lease.render(roleCtx()), lf = lease.foot(roleCtx());
  painted.push(lh, lf);
  if (!/cannot send leases/i.test(lh)) { say('bad', 'мастер договора пускает viewer к работе'); bad++; }
  else say('ok', 'мастер договора отказывает viewer сразу');
  if (/lease:send/.test(lf)) { say('bad', 'viewer видит кнопку отправки договора'); bad++; }
  else say('ok', 'у viewer нет кнопки отправки договора');

  S.inv = null; S.sheet = 'invoice';
  const iid = { buildingId: 'b1', floorId: 'f1', unitId: '301' };
  S.sheetPayload = iid; S.sheetArg = iid; S.payload = iid;
  const ih = invoice.render(roleCtx()), if2 = invoice.foot(roleCtx());
  painted.push(ih, if2);
  if (!/cannot send invoices/i.test(ih)) { say('bad', 'лист счёта пускает viewer к работе'); bad++; }
  else say('ok', 'лист счёта отказывает viewer сразу');
  if (/inv:send/.test(if2)) { say('bad', 'viewer видит кнопку отправки счёта'); bad++; }
  else say('ok', 'у viewer нет кнопки отправки счёта');

  // админ ничего не теряет
  const okH = home.render(ctx());
  if (!/data-k="lease"/.test(okH)) { say('bad', 'у админа пропали кнопки отправки'); bad++; }
  else say('ok', 'у роли с правом отправки всё на месте');
  S.lease = null; S.inv = null; S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
}

/* ---- 4h. юнит без почты: счёт не уйдёт, и это сказано ДО отправки ---- */
{
  S.inv = null; S.sheet = 'invoice';
  const nid = { buildingId: 'b1', floorId: 'f1', unitId: '304' };
  S.sheetPayload = nid; S.sheetArg = nid; S.payload = nid;
  const h = invoice.render(ctx());
  painted.push(h);
  if (!/No email on this unit/i.test(h)) { say('bad', 'юнит без почты не предупреждён на форме счёта'); bad++; }
  else say('ok', 'юнит без почты предупреждён прямо на форме');
  S.inv = null; S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;
}

/* ---- 4i. напоминание, отмена договора, поиск по всем зданиям, типы на плане ---- */
{
  // напоминание доступно ТОЛЬКО когда есть живой счёт и он не оплачен
  const withInv = Object.assign({}, snap, { invoicesAvailable: true });
  S.tab = 'payments'; S.q = ''; S.filter = 'all'; S.limit = 0;
  const ph = payments.render(ctx());
  painted.push(ph);
  if (!/data-act="remind"[^>]*data-inv="in_1U4mHY/.test(ph)) { say('bad', 'нет кнопки напоминания у неоплаченной строки'); bad++; }
  else say('ok', 'у неоплаченной строки со счётом есть кнопка Remind');
  // у строки без счёта кнопки быть не должно — напоминать не о чем
  const remindCount = (ph.match(/data-act="remind"/g) || []).length;
  const overdueCount = (ph.match(/data-s="overdue"/g) || []).length;
  if (remindCount >= overdueCount) { say('bad', `кнопок напоминания ${remindCount} при ${overdueCount} просрочках — есть без счёта`); bad++; }
  else say('ok', 'напоминание только там, где есть выставленный счёт');
  // напоминание НИКОГДА не создаёт новый счёт
  const src = await (await fetch('../m/ui/payments.js?v=' + Date.now())).text();
  const remindBody = src.slice(src.indexOf('async function remind('), src.indexOf('/* ---------- поиск'));
  if (/createStripeInvoice/.test(remindBody)) { say('bad', 'напоминание способно выставить НОВЫЙ счёт'); bad++; }
  else say('ok', 'напоминание не может выставить новый счёт');

  // поиск: нет в текущем здании → показываем найденное в остальных
  S.q = 'Second'; S.searchAll = false;
  const sh = payments.render(ctx());
  painted.push(sh);
  if (!/Found in other buildings/.test(sh)) { say('bad', 'поиск не предлагает найденное в других зданиях'); bad++; }
  else say('ok', 'поиск сам показывает совпадения из других зданий');
  S.q = '';

  // карточка юнита: неподписанный договор виден и его можно отменить
  const withEnv = JSON.parse(JSON.stringify(units[1]));
  withEnv.leaseEnvelopes = [{ envelopeId: 'env_x', status: 'sent', recipientEmail: 'a@b.co', sentAt: '2026-08-10' }];
  snap.buildings[0].floors[0].units[1] = withEnv;
  snap.unitsIndex['b1|301'].unit = withEnv;
  S.sheet = 'unit';
  const uid = { buildingId: 'b1', floorId: 'f1', unitId: '301' };
  S.sheetPayload = uid; S.sheetArg = uid; S.payload = uid;
  const uh = unit.render(ctx());
  painted.push(uh);
  if (!/Lease awaiting signature/.test(uh)) { say('bad', 'неподписанный договор не показан в карточке'); bad++; }
  else say('ok', 'неподписанный договор виден в карточке юнита');
  if (!/data-act="voidenv"[^>]*data-env="env_x"/.test(uh)) { say('bad', 'нет кнопки отмены договора'); bad++; }
  else say('ok', 'договор можно отменить с телефона');
  // viewer отменять не может
  const vh = unit.render(Object.assign(ctx(), { canSend: () => false }));
  if (/data-act="voidenv"/.test(vh)) { say('bad', 'viewer видит кнопку отмены договора'); bad++; }
  else say('ok', 'viewer не может отменить договор');
  snap.buildings[0].floors[0].units[1] = units[1];
  snap.unitsIndex['b1|301'].unit = units[1];
  S.sheet = null; S.sheetPayload = null; S.sheetArg = null; S.payload = null;

  // план: у общих зон подпись типа, у сдаваемых — номер
  S.tab = 'plan'; S.planFloor = 'f4';
  const plh = plan.render(ctx());
  painted.push(plh);
  if (!/STAIRS/.test(plh)) { say('bad', 'на плане нет подписи типа общей зоны'); bad++; }
  else say('ok', 'общие зоны на плане подписаны типом (как на десктопе)');
  // зум обязан ПОКАЗЫВАТЬ БОЛЬШЕ, иначе кнопка бессмысленна
  const nFit = (plh.match(/<text/g) || []).length;
  S.planZoom = true;
  const plz = plan.render(ctx());
  painted.push(plz);
  const nZoom = (plz.match(/<text/g) || []).length;
  if (nZoom <= nFit) { say('bad', `зум не добавил подписей (${nFit} → ${nZoom})`); bad++; }
  else say('ok', `зум показывает больше подписей (${nFit} → ${nZoom})`);
  S.planZoom = false;
  S.tab = 'home'; S.planFloor = null;
}

/* ---- 5. каждое data-act действие кто-то обрабатывает (ловит тупики) ---- */
{
  const acts = new Set();
  painted.join('\n').replace(/data-act="([^"]+)"/g, (m, a) => { acts.add(a); return m; });
  const srcs = await Promise.all(['ui/home.js','ui/payments.js','ui/unit.js','ui/lease.js','ui/invoice.js','ui/switcher.js','ui/plan.js','app.js']
    .map(f => fetch('../m/' + f + V).then(r => r.text())));
  const all = srcs.join('\n');
  // Действие считается живым, если оно встречается в коде НЕ только там, где
  // рисуется (то есть кто-то с ним сравнивается), либо это открытие листа.
  const dead = [...acts].filter(a => {
    const lit = a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return !(new RegExp("=== *'" + lit + "'|case '" + lit + "'|indexOf\\('" + lit.split(':')[0] + ":'\\)").test(all));
  });
  if (dead.length) { say('bad', `data-act with no handler (dead button): ${dead.join(', ')}`); bad++; }
  else say('ok', `all ${acts.size} actions have a handler`);
}

/* ---- 6. ничего технического в тексте для оператора ---- */
{
  const text = painted.join('\n').replace(/<[^>]*>/g, ' ').replace(/&[a-z]+;/g, ' ');
  const iso = text.match(/\b\d{4}-\d{2}-\d{2}\b/g);
  const rawId = text.match(/\bin_[A-Za-z0-9]{20,}\b/g);
  const dangling = text.match(/·\s*(—|$)/gm);
  if (iso) { say('bad', `ISO dates shown to the operator: ${[...new Set(iso)].join(', ')}`); bad++; }
  else say('ok', 'no ISO dates in operator-facing text');
  if (rawId) { say('bad', `raw Stripe ids shown to the operator: ${[...new Set(rawId)].join(', ')}`); bad++; }
  else say('ok', 'no raw Stripe ids in operator-facing text');
  if (dangling) { say('warn', `dangling separator (empty field): ${dangling.length} place(s)`); }
  else say('ok', 'no dangling separators');
}

document.getElementById('log').innerHTML = out.join('\n') + `\n\n${bad ? `<span class="bad">${bad} FAILURES</span>` : '<span class="ok">all render checks passed</span>'}`;
window.__harness = { bad, missing, calls };
window.__snap = snap; window.__S = S; window.__ctx = ctx;   // для ручных проверок в консоли

/* ---- визуальный режим: рисуем один экран в размер телефона ---- */
const want = new URLSearchParams(location.search).get('view');
if (want) {
  document.body.classList.add('visual');
  const mod = Object.assign({}, SCREENS, SHEETS)[want];
  if (!mod) { document.getElementById('screen').textContent = 'unknown view: ' + want; }
  else {
    const isSheet = !!SHEETS[want];
    // ?unit=302 — посмотреть тот же лист на другом юните (свободный / оплаченный).
    // ?unit=none — открыть лист БЕЗ выбранного юнита (шаг «какой юнит»).
    const uid = new URLSearchParams(location.search).get('unit') || '301';
    const ids = uid === 'none' ? null : { buildingId: 'b1', floorId: 'f1', unitId: uid };
    // Состояние мастеров переживает текстовый прогон выше — сбрасываем, иначе
    // визуальный режим покажет чужой шаг, а не тот, что просили.
    S.lease = null; S.inv = null;
    if (isSheet) { S.sheet = want; S.sheetPayload = ids; S.sheetArg = ids; S.payload = ids; }
    // ?preset=service — посмотреть лист счёта с каталогом услуг.
    const preset = new URLSearchParams(location.search).get('preset');
    if (preset && want === 'invoice') { S.inv = null; mod.render(ctx()); if (S.inv) S.inv.preset = preset; }
    // ?real=1 — подставить НАСТОЯЩУЮ геометрию этажей из прода (только формы,
    // без имён арендаторов): синтетика из четырёх коробок не покажет, читаются
    // ли подписи на этаже из шестидесяти юнитов.
    if (new URLSearchParams(location.search).get('real')) {
      try {
        const real = await (await fetch('./fixtures/plan-geometry.json?v=' + Date.now())).json();
        snap.buildings = [real];
        S.scope = real.id; S.buildingId = real.id;
      } catch (e) { console.warn('real geometry not loaded', e); }
    }
    // ?floor=f4 — какой этаж показать на плане.
    const fl = new URLSearchParams(location.search).get('floor');
    if (fl) S.planFloor = fl;
    // ?step=3 — шаг условий договора (проверять живую сводку под полями).
    const step = new URLSearchParams(location.search).get('step');
    if (want === 'lease' && step) {
      mod.render(ctx());
      Object.assign(S.lease, { step: +step, name: 'Elliot Reyes', email: 'elliot@example.com',
        phone: '7275550134', start: '2026-09-01', term: '12' });
    }
    // ?done=1 — экран заселения после отправки договора (&sent=deposit — с уже
    // отправленным депозитом, чтобы видеть обе строки в разных состояниях).
    if (want === 'lease' && new URLSearchParams(location.search).get('done')) {
      mod.render(ctx());
      S.lease.done = { envelopeId: 'env_1', status: 'sent', stateWriteOk: true, email: 'elliot@example.com',
        suite: 'Suite 440', tenant: 'Elliot Reyes', buildingId: 'b1', floorId: 'f4', unitId: '440',
        leaseStart: '2026-09-01' };
      if (new URLSearchParams(location.search).get('sent') === 'deposit') {
        S.lease.done.sent = { deposit: { id: 'in_dep', number: 'D-CEN-440', total: 900, bucket: 'open' } };
      }
    }
    document.getElementById(isSheet ? 'sheetBody' : 'screen').innerHTML = mod.render(ctx());
    const foot = document.getElementById('sheetFoot');
    foot.innerHTML = (isSheet && typeof mod.foot === 'function') ? (mod.foot(ctx()) || '') : '';
    foot.style.display = foot.innerHTML.trim() ? 'flex' : 'none';   // как в оболочке (app.js)
  }
}
</script>
